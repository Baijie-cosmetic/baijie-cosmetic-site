name: Deploy Aochuang website
on:
  push:
    branches: [codex/aochuang-production-release]
permissions:
  contents: read
concurrency:
  group: baijie-site-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        run: npm install --no-save --no-package-lock wrangler@4.165.0
      - name: Upload and deploy static assets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
          account="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          if [[ "$account" =~ ^https://dash\.cloudflare\.com/([0-9a-fA-F]{32})(/|$) ]]; then
            account="${BASH_REMATCH[1]}"
          fi
          if [[ "$account" =~ ^[0-9a-fA-F]{32}$ ]]; then
            export CLOUDFLARE_ACCOUNT_ID="$account"
          else
            echo "Configured account ID is not a 32-character hexadecimal value. Trying Wrangler account discovery."
            unset CLOUDFLARE_ACCOUNT_ID
          fi
          export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/wrangler-upload.jsonl"
          ./node_modules/.bin/wrangler versions upload --keep-vars
          version=$(jq -er 'select(.type == "version-upload" and .worker_name == "baijie-site") | .version_id' "$WRANGLER_OUTPUT_FILE_PATH")
          unset WRANGLER_OUTPUT_FILE_PATH
          # A newly uploaded version can take time to become available for deployment.
          for delay in 10 20 30; do
            sleep "$delay"
            if ./node_modules/.bin/wrangler versions deploy "${version}@100%" --yes 2>&1 | tee "$RUNNER_TEMP/wrangler-deploy.log"; then
              exit 0
            fi
            grep -Fq 'code: 100146' "$RUNNER_TEMP/wrangler-deploy.log" || exit 1
          done
          exit 1
